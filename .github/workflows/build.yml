name: Build Stack-chan Firmware

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "firmware/**"
      - "web/**"
      - "docs/specs/**"
      - "docs/operations/visual-programming-validation.md"
      - "docs/operations/visual-programming-acceptance.md"
      - "docs/operations/ci-validation_ja.md"
      - ".github/scripts/ci-*.mjs"
      - ".github/actions/setup/action.yml"
      - ".github/workflows/build.yml"
      - "lefthook.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "firmware/**"
      - "web/**"
      - "docs/specs/**"
      - "docs/operations/visual-programming-validation.md"
      - "docs/operations/visual-programming-acceptance.md"
      - "docs/operations/ci-validation_ja.md"
      - ".github/scripts/ci-*.mjs"
      - ".github/actions/setup/action.yml"
      - ".github/workflows/build.yml"
      - "lefthook.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect firmware-related changes
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            firmware:
              - "firmware/**"
              - ".github/actions/setup/action.yml"
              - ".github/workflows/build.yml"
              - ".github/scripts/ci-*.mjs"
              - "lefthook.yml"

  biome:
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-moddable: "false"
      - name: Run Biome
        working-directory: ./firmware
        run: npx biome ci . --error-on-warnings

  test-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-moddable: "false"
      - name: Install web dependencies
        working-directory: ./firmware
        run: npm --prefix ../web ci
      - name: Run firmware tests
        working-directory: ./firmware
        run: npm run test
      - name: Test CI result policy and browser suite coverage
        run: node --test .github/scripts/ci-*.test.mjs
      - name: Run legacy name checks
        working-directory: ./firmware
        run: npm run check:legacy-names
      - name: Run architecture checks
        working-directory: ./firmware
        run: npm run check:architecture
      - name: Run web tool tests
        working-directory: ./firmware
        run: npm --prefix ../web test && npm --prefix ../web run check:editor-artifacts

  test-moddable:
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
      - name: Restore incremental Linux test builds
        uses: actions/cache@v6
        with:
          path: |
            ./firmware/dist/tmp/lin
            ./firmware/dist/bin/lin
          key: ${{ steps.setup.outputs.moddable-cache-key }}-lin-tests-v1-shard-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.setup.outputs.moddable-cache-key }}-lin-tests-v1-shard-${{ matrix.shard }}-
      - name: Run manifest preflight
        if: matrix.shard == 0
        working-directory: ./firmware
        run: source "$HOME/.local/share/xs-dev-export.sh" && npm run check:manifest
      - name: Build Virtual Pet MOD for CoreS3
        if: matrix.shard == 0
        working-directory: ./firmware
        run: source "$HOME/.local/share/xs-dev-export.sh" && npm run mod:build -- mods/examples/stackchan_pet/manifest.json --mode=release
      - name: Upload Virtual Pet MOD archive
        if: matrix.shard == 0
        uses: actions/upload-artifact@v7
        with:
          name: stackchan-pet-cores3
          path: firmware/dist/bin/esp32/release/stackchan_pet/stackchan_pet.xsa
          if-no-files-found: error
      - name: Run Moddable module tests
        working-directory: ./firmware
        env:
          STACKCHAN_MODULE_TEST_SHARD_INDEX: ${{ matrix.shard }}
          STACKCHAN_MODULE_TEST_SHARD_TOTAL: 2
          # GCC 14+ makes incompatible-pointer-types an error, which breaks the SDK's libmad in
          # Linux builds. Only the Linux makefile appends to C_FLAGS: keep it out of ESP32 builds.
          C_FLAGS: -Wno-error=incompatible-pointer-types
        run: source "$HOME/.local/share/xs-dev-export.sh" && npm run test:moddable

  test-smoke:
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # GCC 14+ makes incompatible-pointer-types an error, which breaks the SDK's libmad in
      # Linux builds. Only the Linux makefile appends to C_FLAGS: keep it out of ESP32 builds.
      C_FLAGS: -Wno-error=incompatible-pointer-types
      STACKCHAN_LIN_SMOKE_CLEAN: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
      - name: Restore incremental Linux smoke builds
        uses: actions/cache@v6
        with:
          path: |
            ./firmware/dist/tmp/lin
            ./firmware/dist/bin/lin
          key: ${{ steps.setup.outputs.moddable-cache-key }}-lin-smoke-v1-${{ github.sha }}
          restore-keys: |
            ${{ steps.setup.outputs.moddable-cache-key }}-lin-smoke-v1-
      - name: Smoke test Linux simulator startup
        working-directory: ./firmware
        run: source "$HOME/.local/share/xs-dev-export.sh" && npm run smoke:lin
      - name: Smoke test mini app on Linux simulator
        working-directory: ./firmware
        run: source "$HOME/.local/share/xs-dev-export.sh" && npm run smoke:mini-app:lin

  test:
    if: always()
    needs:
      - changes
      - biome
      - test-fast
      - test-moddable
      - test-smoke
      - web-visual
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify test job results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-results.mjs test

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      suites: ${{ steps.matrix.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Select browser suites
        id: matrix
        run: echo "suites=$(node .github/scripts/ci-web-suites.mjs matrix)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          target-branch: "9.0.0"
          install-emscripten: "true"
      - name: Install web test dependencies
        working-directory: ./firmware
        run: npm --prefix ../web ci
      - name: Audit web dependencies
        working-directory: ./firmware
        run: npm --prefix ../web audit --audit-level=high
      - name: Build WebAssembly simulator
        working-directory: ./firmware
        run: source "$HOME/.local/share/xs-dev-export.sh" && npm run build:wasm
      - name: Build Virtual Pet MOD for Simulator
        working-directory: ./firmware
        run: |
          source "$HOME/.local/share/xs-dev-export.sh"
          npm run mod:build:simulator
          node ../web/mod-gallery/stage-pet.mjs
      - name: Build shared browser application
        working-directory: ./firmware
        run: npm --prefix ../web run build
      - name: Upload shared browser runtime
        uses: actions/upload-artifact@v7
        with:
          name: web-runtime-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
      - name: Upload compiled simulator
        uses: actions/upload-artifact@v7
        with:
          name: companion-wasm
          path: |
            web/simulator/mc.js
            web/simulator/mc.wasm
          if-no-files-found: error

  web-browser:
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.web-build.outputs.suites) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser test dependencies
        run: npm --prefix web ci
      - name: Download shared browser runtime
        uses: actions/download-artifact@v8
        with:
          name: web-runtime-${{ github.sha }}
          path: web/dist
      - name: Verify companion browser transport
        if: matrix.suite == 'companion'
        run: |
          node --test web/simulator/conversation-bridge.test.mjs
          npm --prefix gateway ci
          npm --prefix gateway run build
      - name: Run browser suite
        env:
          STACKCHAN_WEB_SUITE: ${{ matrix.suite }}
        run: |
          set -o pipefail
          node .github/scripts/ci-web-suites.mjs run 2>&1 | tee "/tmp/stackchan-${STACKCHAN_WEB_SUITE}.log"
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-visual-${{ matrix.suite }}-diagnostics
          path: |
            /tmp/stackchan-*.png
            /tmp/stackchan-*.json
            /tmp/stackchan-*.log
          if-no-files-found: ignore

  # Keep the existing check name while reflecting every matrix result.
  web-visual:
    if: always()
    needs: [web-build, web-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify browser job results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-results.mjs web
